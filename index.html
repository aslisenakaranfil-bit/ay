<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bu geceki ay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: sakin, zarif, bir defter köşesi
   IDEA: eski bir almanak sayfasındaki ay kartı
   PICTURE: gerçek ay fotoğrafı, o günün evresine göre gölgelenmiş
   COLOUR and TYPE: Aslı'nın Notion paleti (krem, bordo), Cormorant + EB Garamond
   LAYOUT: tek sütun, ortada ay, altında evre, saatler ve sıradaki evreler */
:root{color-scheme:light;--bg:#F5EFE6;--ink:#4A1C24;--accent:#7B2D3A;--soft:#8a6a6e;--rule:#e2d6c8}
:root[data-theme=dark]{color-scheme:dark;--bg:#1d1416;--ink:#f1e5da;--accent:#d9a2ab;--soft:#b39a9c;--rule:#3a2a2d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "EB Garamond",Georgia,serif;overflow-x:clip;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:340px;padding:18px 16px 12px;text-align:center}
.top{font-size:15px;color:var(--soft);margin:0}
.top b{font-weight:500;color:var(--ink)}
.moonbox{position:relative;width:min(72vw,220px);aspect-ratio:1;margin:14px auto 12px}
.moonbox canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;box-shadow:0 6px 22px rgba(74,28,36,.18);opacity:0;transition:opacity .8s ease}
.moonbox canvas.on{opacity:1}
h1{font:600 clamp(26px,8vw,34px)/1.05 "Cormorant Garamond",Georgia,serif;color:var(--accent);margin:0}
.lit{margin:4px 0 0;font-size:16px}
.rows{margin:14px 0 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.rows div{padding:9px 4px}
.rows div+div{border-left:1px solid var(--rule)}
.rows .r2{border-top:1px solid var(--rule)}
.k{display:block;font-size:13px;color:var(--soft)}
.v{display:block;font-size:16px;white-space:nowrap}
.credit{margin:10px 0 0;font-size:11px;color:var(--soft);opacity:.8}
.credit a{color:inherit}
@media(prefers-reduced-motion:reduce){.moonbox canvas{transition:none}}
</style>
</head>
<body>
<main class="card">
  <p class="top"><b id="city">İstanbul</b> · <span id="date"></span></p>
  <div class="moonbox"><canvas id="moon" aria-label="Bu geceki ayın görünümü" role="img"></canvas></div>
  <h1 id="phase">Ay</h1>
  <p class="lit" id="lit"></p>
  <div class="rows">
    <div><span class="k">Ay doğuşu</span><span class="v" id="rise"></span></div>
    <div><span class="k">Ay batışı</span><span class="v" id="set"></span></div>
    <div class="r2"><span class="k" id="n1k"></span><span class="v" id="n1v"></span></div>
    <div class="r2"><span class="k" id="n2k"></span><span class="v" id="n2v"></span></div>
  </div>
  <p class="credit">Fotoğraf: Gregory H. Revera, <a href="https://creativecommons.org/licenses/by-sa/3.0/deed.tr">CC BY-SA 3.0</a></p>
</main>
<script>
{
// Ay hesapları: Meeus, Astronomical Algorithms (bölüm 25, 47, 48, 49)
const RAD = Math.PI / 180;
const sin = d => Math.sin(d * RAD), cos = d => Math.cos(d * RAD);
const norm = d => ((d % 360) + 360) % 360;
const jdFromDate = dt => dt.getTime() / 86400000 + 2440587.5;
const dateFromJd = jd => new Date((jd - 2440587.5) * 86400000);
const DELTA_T = 70 / 86400; // TT - UT, gün

function sunPos(T) {
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  const e = 0.016708634 - 0.000042037 * T;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * sin(M) + (0.019993 - 0.000101 * T) * sin(2 * M) + 0.000289 * sin(3 * M);
  const nu = M + C;
  const R = 1.000001018 * (1 - e * e) / (1 + e * cos(nu));
  const om = 125.04 - 1934.136 * T;
  return { lon: norm(L0 + C - 0.00569 - 0.00478 * sin(om)), R };
}

const LR = [ // D, M, M', F, Σl, Σr
  [0,0,1,0,6288774,-20905355],[2,0,-1,0,1274027,-3699111],[2,0,0,0,658314,-2955968],[0,0,2,0,213618,-569925],
  [0,1,0,0,-185116,48888],[0,0,0,2,-114332,-3149],[2,0,-2,0,58793,246158],[2,-1,-1,0,57066,-152138],
  [2,0,1,0,53322,-170733],[2,-1,0,0,45758,-204586],[0,1,-1,0,-40923,-129620],[1,0,0,0,-34720,108743],
  [0,1,1,0,-30383,104755],[2,0,0,-2,15327,10321],[0,0,1,2,-12528,0],[0,0,1,-2,10980,79661],
  [4,0,-1,0,10675,-34782],[0,0,3,0,10034,-23210],[4,0,-2,0,8548,-21636],[2,1,-1,0,-7888,24208],
  [2,1,0,0,-6766,30824],[1,0,-1,0,-5163,-8379],[1,1,0,0,4987,-16675],[2,-1,1,0,4036,-12831],
  [2,0,2,0,3994,-10445],[4,0,0,0,3861,-11650],[2,0,-3,0,3665,14403],[0,1,-2,0,-2689,-7003],
  [2,0,-1,2,-2602,0],[2,-1,-2,0,2390,10056],[1,0,1,0,-2348,6322],[2,-2,0,0,2236,-9884],
  [0,1,2,0,-2120,5751],[0,2,0,0,-2069,0]
];
const B = [ // D, M, M', F, Σb
  [0,0,0,1,5128122],[0,0,1,1,280602],[0,0,1,-1,277693],[2,0,0,-1,173237],[2,0,-1,1,55413],
  [2,0,-1,-1,46271],[2,0,0,1,32573],[0,0,2,1,17198],[2,0,1,-1,9266],[0,0,2,-1,8822],
  [2,-1,0,-1,8216],[2,0,-2,-1,4324],[2,0,1,1,4200],[2,1,0,-1,-3359],[2,-1,-1,1,2463],
  [2,-1,0,1,2211],[2,-1,-1,-1,2065],[0,1,-1,-1,-1870],[4,0,-1,-1,1828],[0,1,0,1,-1794],[0,0,0,3,-1749]
];

function moonPos(T) {
  const T2 = T * T, T3 = T2 * T, T4 = T3 * T;
  const Lp = 218.3164477 + 481267.88123421 * T - 0.0015786 * T2 + T3 / 538841 - T4 / 65194000;
  const D = 297.8501921 + 445267.1114034 * T - 0.0018819 * T2 + T3 / 545868 - T4 / 113065000;
  const M = 357.5291092 + 35999.0502909 * T - 0.0001536 * T2 + T3 / 24490000;
  const Mp = 134.9633964 + 477198.8675055 * T + 0.0087414 * T2 + T3 / 69699 - T4 / 14712000;
  const F = 93.2720950 + 483202.0175233 * T - 0.0036539 * T2 - T3 / 3526000 + T4 / 863310000;
  const A1 = 119.75 + 131.849 * T, A2 = 53.09 + 479264.290 * T, A3 = 313.45 + 481266.484 * T;
  const E = 1 - 0.002516 * T - 0.0000074 * T2;
  let sl = 0, sr = 0, sb = 0;
  for (const [d, m, mp, f, l, r] of LR) {
    const arg = d * D + m * M + mp * Mp + f * F;
    const ef = Math.abs(m) === 1 ? E : Math.abs(m) === 2 ? E * E : 1;
    sl += l * ef * sin(arg); sr += r * ef * cos(arg);
  }
  for (const [d, m, mp, f, b] of B) {
    const ef = Math.abs(m) === 1 ? E : Math.abs(m) === 2 ? E * E : 1;
    sb += b * ef * sin(d * D + m * M + mp * Mp + f * F);
  }
  sl += 3958 * sin(A1) + 1962 * sin(Lp - F) + 318 * sin(A2);
  sb += -2235 * sin(Lp) + 382 * sin(A3) + 175 * sin(A1 - F) + 175 * sin(A1 + F) + 127 * sin(Lp - Mp) - 115 * sin(Lp + Mp);
  return { lon: norm(Lp + sl / 1e6), lat: sb / 1e6, dist: 385000.56 + sr / 1000 };
}

function illumination(dt) {
  const T = (jdFromDate(dt) + DELTA_T - 2451545) / 36525;
  const s = sunPos(T), m = moonPos(T);
  const cpsi = cos(m.lat) * cos(m.lon - s.lon);
  const psi = Math.acos(cpsi) / RAD;
  const Rkm = s.R * 149597870.7;
  const i = Math.atan2(Rkm * sin(psi), m.dist - Rkm * cpsi);
  return { k: (1 + Math.cos(i)) / 2, waxing: sin(m.lon - s.lon) > 0, elong: norm(m.lon - s.lon) };
}

function moonAltitude(dt, lat, lon) {
  const jd = jdFromDate(dt);
  const T = (jd + DELTA_T - 2451545) / 36525;
  const m = moonPos(T);
  const eps = 23.4392911 - 0.0130042 * T;
  const ra = Math.atan2(sin(m.lon) * cos(eps) - Math.tan(m.lat * RAD) * sin(eps), cos(m.lon)) / RAD;
  const dec = Math.asin(sin(m.lat) * cos(eps) + cos(m.lat) * sin(eps) * sin(m.lon)) / RAD;
  const Tu = (jd - 2451545) / 36525;
  const gmst = 280.46061837 + 360.98564736629 * (jd - 2451545) + 0.000387933 * Tu * Tu;
  const H = gmst + lon - ra;
  const h = Math.asin(sin(lat) * sin(dec) + cos(lat) * cos(dec) * cos(H)) / RAD;
  const par = Math.asin(6378.14 / m.dist) / RAD;
  return h - (0.7275 * par - 0.5667);
}

// Gün içinde ayın doğuş ve batışı (start: yerel gece yarısının Date karşılığı)
function riseSet(start, lat, lon) {
  const step = 10 * 60000, out = { rise: null, set: null };
  let t0 = start.getTime(), a0 = moonAltitude(start, lat, lon);
  for (let t = t0 + step; t <= start.getTime() + 86400000; t += step) {
    const a1 = moonAltitude(new Date(t), lat, lon);
    if ((a0 < 0) !== (a1 < 0)) {
      let lo = t - step, hi = t, alo = a0;
      for (let j = 0; j < 20; j++) {
        const mid = (lo + hi) / 2, am = moonAltitude(new Date(mid), lat, lon);
        if ((am < 0) === (alo < 0)) { lo = mid; alo = am; } else hi = mid;
      }
      const when = new Date((lo + hi) / 2);
      if (a0 < 0 && !out.rise) out.rise = when;
      if (a0 >= 0 && !out.set) out.set = when;
    }
    a0 = a1;
  }
  return out;
}

// Ana evre anları (q: 0 yeni ay, 0.25 ilk dördün, 0.5 dolunay, 0.75 son dördün)
function phaseTime(kInt, q) {
  const k = kInt + q, T = k / 1236.85, T2 = T * T, T3 = T2 * T, T4 = T3 * T;
  let jde = 2451550.09766 + 29.530588861 * k + 0.00015437 * T2 - 0.000000150 * T3 + 0.00000000073 * T4;
  const E = 1 - 0.002516 * T - 0.0000074 * T2;
  const M = 2.5534 + 29.10535670 * k - 0.0000014 * T2 - 0.00000011 * T3;
  const Mp = 201.5643 + 385.81693528 * k + 0.0107582 * T2 + 0.00001238 * T3 - 0.000000058 * T4;
  const F = 160.7108 + 390.67050284 * k - 0.0016118 * T2 - 0.00000227 * T3 + 0.000000011 * T4;
  const Om = 124.7746 - 1.56375588 * k + 0.0020672 * T2 + 0.00000215 * T3;
  let c;
  if (q === 0 || q === 0.5) {
    const n = q === 0;
    c = (n ? -0.40720 : -0.40614) * sin(Mp) + (n ? 0.17241 : 0.17302) * E * sin(M) + (n ? 0.01608 : 0.01614) * sin(2 * Mp)
      + (n ? 0.01039 : 0.01043) * sin(2 * F) + (n ? 0.00739 : 0.00734) * E * sin(Mp - M) - (n ? 0.00514 : 0.00515) * E * sin(Mp + M)
      + (n ? 0.00208 : 0.00209) * E * E * sin(2 * M) - 0.00111 * sin(Mp - 2 * F) - 0.00057 * sin(Mp + 2 * F)
      + 0.00056 * E * sin(2 * Mp + M) - 0.00042 * sin(3 * Mp) + 0.00042 * E * sin(M + 2 * F) + 0.00038 * E * sin(M - 2 * F)
      - 0.00024 * E * sin(2 * Mp - M) - 0.00017 * sin(Om) - 0.00007 * sin(Mp + 2 * M) + 0.00004 * sin(2 * Mp - 2 * F)
      + 0.00004 * sin(3 * M) + 0.00003 * sin(Mp + M - 2 * F) + 0.00003 * sin(2 * Mp + 2 * F) - 0.00003 * sin(Mp + M + 2 * F)
      + 0.00003 * sin(Mp - M + 2 * F) - 0.00002 * sin(Mp - M - 2 * F) - 0.00002 * sin(3 * Mp + M) + 0.00002 * sin(4 * Mp);
  } else {
    c = -0.62801 * sin(Mp) + 0.17172 * E * sin(M) - 0.01183 * E * sin(Mp + M) + 0.00862 * sin(2 * Mp) + 0.00804 * sin(2 * F)
      + 0.00454 * E * sin(Mp - M) + 0.00204 * E * E * sin(2 * M) - 0.00180 * sin(Mp - 2 * F) - 0.00070 * sin(Mp + 2 * F)
      - 0.00040 * sin(3 * Mp) - 0.00034 * E * sin(2 * Mp - M) + 0.00032 * E * sin(M + 2 * F) + 0.00032 * E * sin(M - 2 * F)
      - 0.00028 * E * E * sin(Mp + 2 * M) + 0.00027 * E * sin(2 * Mp + M) - 0.00017 * sin(Om) - 0.00005 * sin(Mp - M - 2 * F)
      + 0.00004 * sin(2 * Mp + 2 * F) - 0.00004 * sin(Mp + M + 2 * F) + 0.00004 * sin(Mp - 2 * M) + 0.00003 * sin(Mp + M - 2 * F)
      + 0.00003 * sin(3 * M) + 0.00002 * sin(2 * Mp - 2 * F) + 0.00002 * sin(Mp - M + 2 * F) - 0.00002 * sin(3 * Mp + M);
    const W = 0.00306 - 0.00038 * E * cos(M) + 0.00026 * cos(Mp) - 0.00002 * cos(Mp - M) + 0.00002 * cos(Mp + M) + 0.00002 * cos(2 * F);
    c += q === 0.25 ? W : -W;
  }
  const A = [[299.77, 0.107408, 0.000325], [251.88, 0.016321, 0.000165], [251.83, 26.651886, 0.000164], [349.42, 36.412478, 0.000126],
    [84.66, 18.206239, 0.000110], [141.74, 53.303771, 0.000062], [207.14, 2.453732, 0.000060], [154.84, 7.306860, 0.000056],
    [34.52, 27.261239, 0.000047], [207.19, 0.121824, 0.000042], [291.34, 1.844379, 0.000040], [161.72, 24.198154, 0.000037],
    [239.56, 25.513099, 0.000035], [331.55, 3.592518, 0.000023]];
  let add = 0;
  A.forEach(([a, b, amp], i) => { add += amp * sin(a + b * k - (i === 0 ? 0.009173 * T2 : 0)); });
  return dateFromJd(jde + c + add - DELTA_T);
}

function phaseEvents(dt) {
  const year = dt.getUTCFullYear() + dt.getUTCMonth() / 12;
  const k0 = Math.floor((year - 2000) * 12.3685) - 2;
  const ev = [];
  for (let k = k0; k < k0 + 5; k++) for (const q of [0, 0.25, 0.5, 0.75]) ev.push({ q, t: phaseTime(k, q) });
  return ev.sort((a, b) => a.t - b.t);
}

const NAMES = { 0: 'Yeni ay', 0.25: 'İlk dördün', 0.5: 'Dolunay', 0.75: 'Son dördün' };

const fmtDate = new Intl.DateTimeFormat('tr-TR', { timeZone: PLACE.tz, day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' });
const fmtShort = new Intl.DateTimeFormat('tr-TR', { timeZone: PLACE.tz, day: 'numeric', month: 'long' });
const fmtTime = new Intl.DateTimeFormat('tr-TR', { timeZone: PLACE.tz, hour: '2-digit', minute: '2-digit' });
const dayKey = d => new Intl.DateTimeFormat('en-CA', { timeZone: PLACE.tz }).format(d);

function localMidnight(now) {
  const [y, m, d] = dayKey(now).split('-').map(Number);
  const guess = Date.UTC(y, m - 1, d);
  const p = new Intl.DateTimeFormat('en-US', { timeZone: PLACE.tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date(guess));
  const g = t => +p.find(x => x.type === t).value;
  const offset = Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute')) - guess;
  return new Date(guess - offset);
}

const img = new Image();
let lastIll = null;

function drawMoon(ill) {
  const cv = document.getElementById('moon');
  const S = cv.clientWidth, dpr = window.devicePixelRatio || 1;
  if (!S || !img.complete) return;
  cv.width = Math.round(S * dpr); cv.height = Math.round(S * dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = S / 2, cx = r, cy = r;
  c.save();
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.clip();
  c.drawImage(img, 0, 0, S, S);
  // Karanlık taraf: büyürken solda, küçülürken sağda
  const s = ill.waxing ? -1 : 1, k = ill.k, w = r * Math.abs(1 - 2 * k), dir = k < 0.5 ? -s : s;
  const N = 90;
  c.beginPath();
  for (let i = 0; i <= N; i++) { const f = Math.PI * i / N; c.lineTo(cx + s * r * Math.sin(f), cy - r * Math.cos(f)); }
  for (let i = 0; i <= N; i++) { const f = Math.PI * i / N; c.lineTo(cx + dir * w * Math.sin(f), cy + r * Math.cos(f)); }
  c.closePath();
  c.filter = 'blur(' + Math.max(1, S / 140) + 'px)';
  c.fillStyle = 'rgba(14,9,12,0.9)';
  c.fill();
  c.filter = 'none';
  c.restore();
  cv.classList.add('on');
}

function render() {
  const now = new Date();
  const ill = illumination(now);
  lastIll = ill;
  const today = dayKey(now);
  const start = localMidnight(now);
  const ev = phaseEvents(now);
  const todays = ev.find(e => dayKey(e.t) === today);
  let name;
  if (todays) name = NAMES[todays.q];
  else if (ill.waxing) name = ill.k < 0.5 ? 'Büyüyen hilal' : 'Büyüyen şişkin ay';
  else name = ill.k < 0.5 ? 'Küçülen hilal' : 'Küçülen şişkin ay';

  document.getElementById('city').textContent = PLACE.city;
  document.getElementById('date').textContent = fmtDate.format(now);
  document.getElementById('phase').textContent = name;
  document.getElementById('lit').textContent = '%' + (ill.k * 100).toLocaleString('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' aydınlık';

  const rs = riseSet(start, PLACE.lat, PLACE.lon);
  document.getElementById('rise').textContent = rs.rise ? fmtTime.format(rs.rise) : 'bugün yok';
  document.getElementById('set').textContent = rs.set ? fmtTime.format(rs.set) : 'bugün yok';

  const next = q => ev.find(e => e.q === q && e.t >= start);
  const list = [{ q: 0.5, e: next(0.5) }, { q: 0, e: next(0) }].sort((a, b) => a.e.t - b.e.t);
  list.forEach((x, i) => {
    const isToday = dayKey(x.e.t) === today;
    document.getElementById('n' + (i + 1) + 'k').textContent = NAMES[x.q];
    document.getElementById('n' + (i + 1) + 'v').textContent = (isToday ? 'bugün' : fmtShort.format(x.e.t)) + ', ' + fmtTime.format(x.e.t);
  });
  drawMoon(ill);
}

img.onload = () => { if (lastIll) drawMoon(lastIll); };
img.src = MOON_SRC;
render();
const ro = new ResizeObserver(() => { if (lastIll) drawMoon(lastIll); });
ro.observe(document.getElementById('moon'));
setInterval(render, 10 * 60000);
}
